<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alquimista - Colección de Perfumes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; scroll-behavior: smooth; }

        .contenedor-flexible {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
             /* Necesario para habilitar el espacio 3D */
             perspective: 1000px; 
        }

        .tarjeta-perfume {
            height: 320px;
             /* Transición suave cuando el mouse sale de la tarjeta */
             transition: transform 0.15s ease-out, box-shadow 0.3s ease;
            overflow: hidden;
            position: relative;
            -webkit-tap-highlight-color: transparent;
            transform-style: preserve-3d;
            will-change: transform;
        }

        /* Capa de brillo dinámico (Efecto Tilt Codrops) */
        .tarjeta-shine {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 50%, rgba(245, 158, 11, 0.15) 0%, transparent 80%);
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
            z-index: 10;
        }
/*
        .tarjeta-perfume:hover .tarjeta-shine {
            opacity: 1;
        }*/

        @media (min-width: 1024px) {
            .tarjeta-perfume { flex: 1 1 calc(25% - 1.125rem); max-width: calc(25% - 1.125rem); }
        }
        @media (min-width: 768px) and (max-width: 1023px) {
            .tarjeta-perfume { flex: 1 1 calc(33.333% - 1rem); max-width: calc(33.333% - 1rem); }
        }
        @media (min-width: 640px) and (max-width: 767px) {
            .tarjeta-perfume { flex: 1 1 calc(50% - 0.75rem); max-width: calc(50% - 0.75rem); }
        }
        @media (max-width: 639px) {
            .tarjeta-perfume { flex: 1 1 100%; max-width: 100%; }
        }
        
        .tarjeta-perfume.expandida {
            flex: 1 1 100% !important;
            max-width: 100% !important;
            height: 520px !important;
            border-color: #f59e0b;
            border-width: 2px;
            cursor: default;
            box-shadow: 0 20px 40px -15px rgba(245, 158, 11, 0.2);
            transform: none !important; /* Desactiva el tilt cuando está expandida */
        }
        @media (max-width: 767px) {
            .tarjeta-perfume.expandida { height: 750px !important; }
            .tarjeta-perfume:active .marco-svg,
    .tarjeta-perfume.expandida .marco-svg {
        stroke-dashoffset: 0;
    }
        }

        @media (min-width: 768px) {
    .tarjeta-perfume:hover .marco-svg {
        stroke-dashoffset: 0;
    }
}
        .vista-normal, .vista-detalle {
            position: absolute;
            inset: 0;
            padding: 1.25rem;
            transition: opacity 0.35s ease-in-out, transform 0.35s ease-in-out;
        }

        .vista-detalle {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.98);
            display: flex;
        }

        .tarjeta-perfume.expandida .vista-normal {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.98);
        }

        .tarjeta-perfume.expandida .vista-detalle {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
            transition-delay: 0.1s;
        }

        #drawer-deseos {
            transform: translateX(100%);
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1);
        }
        #drawer-deseos.abierto {
            transform: translateX(0);
        }

        /*MARCO*/
        /* Contenedor del marco SVG progresivo */
        .marco-svg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            border-radius: 1rem; /* Coincide con rounded-2xl o rounded-xl */
            overflow: hidden;
            z-index: 20;

            fill: none;
    stroke: #f59e0b; /* Color ámbar */
    stroke-width: 2;
    stroke-dasharray: 400;
    stroke-dashoffset: 400;
    transition: stroke-dashoffset 0.6s ease-in-out;
    border-radius: 1rem;
        }

        .marco-svg rect {
            width: 100%;
            height: 100%;
            /*rx: 1rem; /* Radio de las esquinas */
            /*ry: 1rem;*/
            fill: none;
            stroke: #f59e0b; /* Color ámbar de tu paleta */
            stroke-width: 2px;
            stroke-dasharray: 1200; /* Longitud estimada del perímetro */
            stroke-dashoffset: 1200; /* Inicialmente oculto por completo */
            transition: stroke-dashoffset 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* Activar efectos solo cuando NO está expandida */
        .tarjeta-perfume:not(.expandida):hover .tarjeta-shine,
        .tarjeta-perfume:not(.expandida):active .tarjeta-shine {
            opacity: 1;
        }

        .tarjeta-perfume:not(.expandida):hover .marco-svg rect,
        .tarjeta-perfume:not(.expandida):active .marco-svg rect {
            stroke-dashoffset: 0;
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen selection:bg-amber-500 selection:text-zinc-950">

    <header id="header-principal" class="border-b border-zinc-800/80 bg-zinc-900/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-5 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <span class="text-xs uppercase tracking-widest text-amber-500 font-semibold">Catálogo Personal</span>
                <h1 class="text-3xl font-bold tracking-tight text-white">ALQUIMISTA</h1>
            </div>
            
            <div class="flex items-center gap-3">
                <button onclick="toggleDeseos()" class="bg-zinc-800/80 hover:bg-zinc-700/80 border border-zinc-700/50 px-4 py-2.5 rounded-full flex items-center gap-2.5 shadow-lg transition-all cursor-pointer">
                    <span class="text-amber-400 text-base">♥</span>
                    <span class="text-sm font-medium text-zinc-300">Deseos:</span>
                    <span id="contador-deseos" class="bg-amber-500 text-zinc-950 text-xs font-bold px-2 py-0.5 rounded-full">0</span>
                </button>

                <div class="bg-zinc-800/80 border border-zinc-700/50 px-5 py-2.5 rounded-full flex items-center gap-3 shadow-lg">
                    <span class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse"></span>
                    <span class="text-sm font-medium text-zinc-300">Total:</span>
                    <span id="total-perfumes" class="text-lg font-bold text-amber-400">0</span>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <div class="mb-8 relative w-full md:w-[500px]">
            <input type="text" id="buscador" placeholder="Busca por marca, nombre, tipo, temporada o notas..." 
                class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-zinc-200 focus:outline-none focus:border-amber-500 transition-colors shadow-inner">
        </div>

        <div id="grid-perfumes" class="contenedor-flexible w-full">
            <!-- Cargado dinámicamente -->
        </div>
    </main>

    <!-- PANEL LATERAL DE DESEOS -->
    <div id="overlay-deseos" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden transition-opacity" onclick="toggleDeseos()"></div>
    
    <div id="drawer-deseos" class="fixed top-0 right-0 h-full w-full sm:w-[420px] bg-zinc-900 border-l border-zinc-800 z-50 shadow-2xl flex flex-col p-6">
        <div class="flex justify-between items-center pb-4 border-b border-zinc-800">
            <div>
                <span class="text-xs uppercase tracking-widest text-amber-500 font-semibold">Pendientes por adquirir</span>
                <h2 class="text-xl font-bold text-white">Lista de Deseos</h2>
            </div>
            <button onclick="toggleDeseos()" class="w-9 h-9 rounded-full bg-zinc-800 hover:bg-amber-500 hover:text-zinc-950 text-zinc-300 flex items-center justify-center font-bold transition-all cursor-pointer">
                ✕
            </button>
        </div>

        <div id="seccion-auth" class="py-3 border-b border-zinc-800 flex justify-between items-center text-xs">
            <span id="auth-status" class="text-zinc-400">Modo Público (Solo lectura)</span>
            <button onclick="verificarPropietario()" id="btn-auth-accion" class="text-amber-400 hover:underline font-semibold cursor-pointer">¿Eres el propietario?</button>
        </div>

        <div id="lista-deseos-container" class="flex-1 overflow-y-auto py-4 space-y-4">
            <!-- Se llena dinámicamente -->
        </div>
    </div>

    <script>
        // CONFIGURACIÓN DE JSONBIN.IO (Sustituye con tus datos reales)
        const BIN_ID = "6aa1e374ac6210605aba0024";
        const MASTER_KEY = "$2a$10$0YxiaorUR6fwa6bR/aYZSeA6/kBCWGeVgzNrLeXUPzAb2TW/Fp0TC";

        let catalogoData = [];
        let deseosData = [];
        let esPropietario = localStorage.getItem('alquimista_admin') === 'true';
        const PIN_SECRETO = "1985"; 

        async function inicializarCatalogo() {
            try {
                // Obtenemos los datos directamente de la nube (JSONbin) para que estén sincronizados en todos lados
                const respuesta = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                    headers: {
                        'X-Master-Key': MASTER_KEY
                    }
                });
                
                const resultado = await respuesta.json();
                const datos = resultado.record;

                catalogoData = datos.catalogo || [];
                deseosData = datos.deseos || [];

                renderizarGrid(catalogoData);
                renderizarDeseos();
                actualizarInterfazAuth();
            } catch (error) {
                console.error("Error al sincronizar con la nube:", error);
                document.getElementById('grid-perfumes').innerHTML = '<p class="text-red-400 text-sm">Error al conectar con la base de datos en la nube.</p>';
            }
        }

        async function guardarEnNube() {
            try {
                const cuerpoDatos = {
                    catalogo: catalogoData,
                    deseos: deseosData
                };

                await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': MASTER_KEY
                    },
                    body: JSON.stringify(cuerpoDatos)
                });
            } catch (error) {
                console.error("Error al guardar en la nube:", error);
                alert("Hubo un error al actualizar la nube.");
            }
        }

        function verificarPropietario() {
            if (esPropietario) {
                esPropietario = false;
                localStorage.setItem('alquimista_admin', 'false');
                alert("Has salido del modo propietario.");
            } else {
                const pin = prompt("Ingresa tu PIN de seguridad:");
                if (pin === PIN_SECRETO) {
                    esPropietario = true;
                    localStorage.setItem('alquimista_admin', 'true');
                    alert("¡Acceso concedido! Modo propietario activado.");
                } else if (pin !== null) {
                    alert("PIN incorrecto.");
                }
            }
            actualizarInterfazAuth();
            renderizarDeseos();
        }

        function actualizarInterfazAuth() {
            const statusEl = document.getElementById('auth-status');
            const btnAuth = document.getElementById('btn-auth-accion');
            
            if (esPropietario) {
                statusEl.innerText = "Modo Propietario Activo 🔓";
                statusEl.className = "text-amber-400 font-semibold";
                btnAuth.innerText = "Cerrar sesión";
            } else {
                statusEl.innerText = "Modo Público (Solo lectura) 🔒";
                statusEl.className = "text-zinc-400";
                btnAuth.innerText = "¿Eres el propietario?";
            }
        }

        function renderizarGrid(datos) {
            const grid = document.getElementById('grid-perfumes');
            grid.innerHTML = '';
            
            datos.forEach((perfume) => {
                const card = document.createElement('div');
                card.id = `tarjeta-${perfume.id}`;
                card.dataset.id = perfume.id;
                card.className = "tarjeta-perfume bg-zinc-900 border border-zinc-800/80 rounded-2xl shadow-xl cursor-pointer group flex flex-col";
                
                const seccionNivelMl = perfume.pocosMl ? `
                    <div class="mt-3 bg-zinc-950/60 p-2.5 rounded-xl border border-zinc-800/80">
                        <div class="flex justify-between text-[11px] text-zinc-400 uppercase tracking-wider mb-1 font-semibold">
                            <span>Nivel del Frasco</span>
                            <span class="text-amber-400">Pocos ml (${perfume.nivelMl}%)</span>
                        </div>
                        <div class="w-full bg-zinc-800 h-2 rounded-full overflow-hidden p-0.5 border border-zinc-700/50">
                            <div class="bg-amber-600 h-full rounded-full transition-all duration-1000" style="width: ${perfume.nivelMl}%"></div>
                        </div>
                    </div>
                ` : '';

                card.innerHTML = `
                    <!-- MARCO PROGRESIVO SVG (Efecto de trazo fluido) -->
                    <svg class="marco-svg">
                        <rect rx="16" ry="16"></rect>
                    </svg>

                    <div class="tarjeta-shine"></div>

                    <div class="vista-normal flex flex-col h-full w-full justify-between">
                        <div class="h-40 rounded-xl bg-zinc-950 overflow-hidden border border-zinc-800/50 flex items-center justify-center relative">
                            <img src="${perfume.imagen}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700 ease-out opacity-80 group-hover:opacity-100">
                        </div>
                        <div>
                            <span class="text-xs font-bold tracking-widest text-amber-500 uppercase block mb-0.5">${perfume.marca}</span>
                            <h3 class="text-base font-semibold text-zinc-100">${perfume.nombre}</h3>
                        </div>
                        <div class="pt-2 border-t border-zinc-800/60 flex items-center justify-between text-xs text-zinc-500">
                            <span>Clic para expandir</span>
                            <span class="text-amber-500 font-bold">→</span>
                        </div>
                    </div>

                    <div class="vista-detalle p-6 md:p-8 flex flex-col md:flex-row gap-6 items-center h-full">
                        <div class="w-full md:w-1/3 h-48 md:h-full rounded-xl overflow-hidden border border-zinc-800 flex-shrink-0 bg-zinc-950">
                            <img src="${perfume.imagen}" class="w-full h-full object-cover">
                        </div>

                        <div class="flex-1 w-full flex flex-col h-full justify-between overflow-y-auto">
                            <div>
                                <div class="flex justify-between items-start mb-2">
                                    <div>
                                        <span class="text-xs font-bold tracking-widest text-amber-500 uppercase">${perfume.marca}</span>
                                        <h2 class="text-2xl font-bold text-white">${perfume.nombre}</h2>
                                    </div>
                                    <button onclick="event.stopPropagation(); cerrarTarjeta('${perfume.id}');" class="w-9 h-9 rounded-full bg-zinc-800/90 hover:bg-amber-500 hover:text-zinc-950 text-zinc-300 flex items-center justify-center font-bold transition-all cursor-pointer z-10 shadow-md">
                                        ✕
                                    </button>
                                </div>
                                
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-2 text-xs text-zinc-300 mb-3">
                                    <div class="bg-zinc-950/60 p-2.5 rounded-xl border border-zinc-800/80">
                                        <strong class="text-amber-400 block mb-0.5">Tipo (Estilo):</strong>${perfume.familia}
                                    </div>
                                    <div class="bg-zinc-950/60 p-2.5 rounded-xl border border-zinc-800/80">
                                        <strong class="text-amber-400 block mb-0.5">Uso / Temporada:</strong>${perfume.temporada}
                                    </div>
                                </div>

                                <div class="bg-zinc-950/60 p-3 rounded-xl border border-zinc-800/80">
                                    <div class="flex gap-2 border-b border-zinc-800 pb-2 mb-2">
                                        <button onclick="cambiarPestaña('${perfume.id}', 'salida', event)" id="btn-${perfume.id}-salida" class="text-xs font-bold px-3 py-1 rounded-lg bg-amber-500 text-zinc-950 transition-all cursor-pointer">Salida</button>
                                        <button onclick="cambiarPestaña('${perfume.id}', 'corazon', event)" id="btn-${perfume.id}-corazon" class="text-xs font-bold px-3 py-1 rounded-lg bg-zinc-800 text-zinc-400 hover:text-white transition-all cursor-pointer">Corazón</button>
                                        <button onclick="cambiarPestaña('${perfume.id}', 'fondo', event)" id="btn-${perfume.id}-fondo" class="text-xs font-bold px-3 py-1 rounded-lg bg-zinc-800 text-zinc-400 hover:text-white transition-all cursor-pointer">Fondo</button>
                                    </div>
                                    <div id="contenido-${perfume.id}" class="text-xs text-zinc-300 min-h-[36px] flex items-center">
                                        ${perfume.notasSalida}
                                    </div>
                                </div>

                                ${seccionNivelMl}
                            </div>
                        </div>
                    </div>
                `;

                // --- LÓGICA DEL EFECTO TILT (3D HOVER) ---
                card.addEventListener('mousemove', (e) => {
                    if (card.classList.contains('expandida')) return;
                    
                    const rect = card.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;

                    const centerX = rect.width / 2;
                    const centerY = rect.height / 2;

                    const rotateX = ((y - centerY) / centerY) * -8;
                    const rotateY = ((x - centerX) / centerX) * 8;

                    card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-4px)`;
                    
                    const shine = card.querySelector('.tarjeta-shine');
                    shine.style.background = `radial-gradient(circle at ${x}px ${y}px, rgba(245, 158, 11, 0.25) 0%, transparent 70%)`;
                });

                card.addEventListener('mouseleave', () => {
                    if (card.classList.contains('expandida')) return;
                    card.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) translateY(0px)';
                });

                card.onclick = () => abrirTarjeta(perfume.id);
                grid.appendChild(card);
            });

            document.getElementById('total-perfumes').innerText = datos.length;
        }

        function renderizarDeseos() {
            const container = document.getElementById('lista-deseos-container');
            document.getElementById('contador-deseos').innerText = deseosData.length;
            container.innerHTML = '';

            if (deseosData.length === 0) {
                container.innerHTML = '<p class="text-zinc-500 text-xs text-center py-8">No hay perfumes en tu lista de deseos.</p>';
                return;
            }

            deseosData.forEach((perfume) => {
                const item = document.createElement('div');
                item.className = "bg-zinc-950/60 border border-zinc-800/80 rounded-xl p-3 flex gap-3 items-center justify-between";
                
                const botonAccion = esPropietario ? `
                    <button onclick="adquirirPerfume('${perfume.id}')" class="bg-amber-500 hover:bg-amber-400 text-zinc-950 text-xs font-bold px-3 py-2 rounded-lg transition-all cursor-pointer shadow-md flex-shrink-0">
                        ¡Lo adquirí!
                    </button>
                ` : `<span class="text-[10px] text-zinc-500 italic">🔒 Solo lectura</span>`;

                item.innerHTML = `
                    <div class="flex items-center gap-3">
                        <img src="${perfume.imagen}" class="w-12 h-12 rounded-lg object-cover border border-zinc-800">
                        <div>
                            <span class="text-[10px] font-bold tracking-widest text-amber-500 uppercase block">${perfume.marca}</span>
                            <h4 class="text-sm font-semibold text-white">${perfume.nombre}</h4>
                        </div>
                    </div>
                    ${botonAccion}
                `;
                container.appendChild(item);
            });
        }

        function toggleDeseos() {
            const drawer = document.getElementById('drawer-deseos');
            const overlay = document.getElementById('overlay-deseos');
            drawer.classList.toggle('abierto');
            overlay.classList.toggle('hidden');
        }

        async function adquirirPerfume(id) {
            if (!esPropietario) return;
            
            const index = deseosData.findIndex(p => p.id === id);
            if (index !== -1) {
                const [perfumeAdquirido] = deseosData.splice(index, 1);
                catalogoData.push(perfumeAdquirido);

                await guardarEnNube();

                renderizarGrid(catalogoData);
                renderizarDeseos();
            }
        }

        function cambiarPestaña(id, tipo, event) {
            event.stopPropagation();
            const perfume = catalogoData.find(p => p.id === id);
            if (!perfume) return;
            
            const contenedor = document.getElementById(`contenido-${id}`);
            const cardEl = document.getElementById(`tarjeta-${id}`);
            
            cardEl.querySelectorAll(`[id^="btn-${id}-"]`).forEach(btn => {
                btn.className = "text-xs font-bold px-3 py-1 rounded-lg bg-zinc-800 text-zinc-400 hover:text-white transition-all cursor-pointer";
            });

            event.target.className = "text-xs font-bold px-3 py-1 rounded-lg bg-amber-500 text-zinc-950 transition-all cursor-pointer";

            if (tipo === 'salida') contenedor.innerText = perfume.notasSalida;
            if (tipo === 'corazon') contenedor.innerText = perfume.notasCorazon;
            if (tipo === 'fondo') contenedor.innerText = perfume.notasFondo;
        }

        function abrirTarjeta(id) {
            const grid = document.getElementById('grid-perfumes');
            document.querySelectorAll('.tarjeta-perfume').forEach(card => card.classList.remove('expandida'));
            
            const tarjetaSeleccionada = document.getElementById(`tarjeta-${id}`);
            grid.prepend(tarjetaSeleccionada);
            
            tarjetaSeleccionada.classList.add('expandida');
            grid.classList.add('modo-clic');

            setTimeout(() => {
                const headerHeight = document.getElementById('header-principal').offsetHeight;
                const tarjetaRect = tarjetaSeleccionada.getBoundingClientRect();
                const targetScrollY = window.pageYOffset + tarjetaRect.top - headerHeight - 15;
                
                window.scrollTo({
                    top: targetScrollY,
                    behavior: 'smooth'
                });
            }, 100);
        }

        function cerrarTarjeta(id) {
            const tarjeta = document.getElementById(`tarjeta-${id}`);
            const grid = document.getElementById('grid-perfumes');
            
            tarjeta.classList.remove('expandida');
            
            setTimeout(() => {
                grid.classList.remove('modo-clic');
                tarjeta.style.transform = 'perspective(1000px) rotateX(0deg) rotateY(0deg) translateY(0px)';
            }, 300);
        }

        document.getElementById('buscador').addEventListener('input', (e) => {
            const filtro = e.target.value.toLowerCase().trim();
            const filtrados = catalogoData.filter(p => 
                p.marca.toLowerCase().includes(filtro) || 
                p.nombre.toLowerCase().includes(filtro) ||
                p.familia.toLowerCase().includes(filtro) ||
                p.temporada.toLowerCase().includes(filtro) ||
                p.notasSalida.toLowerCase().includes(filtro) ||
                p.notasCorazon.toLowerCase().includes(filtro) ||
                p.notasFondo.toLowerCase().includes(filtro)
            );
            renderizarGrid(filtrados);
        });

        inicializarCatalogo();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alquimista - Colección de Perfumes</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; scroll-behavior: smooth; }

        .contenedor-flexible {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
        }

        /* Transición ultra suave */
        .tarjeta-perfume {
            height: 320px;
            transition: all 0.8s cubic-bezier(0.25, 1, 0.5, 1);
            overflow: hidden;
            position: relative;
        }

        /* Lógica de hover en escritorio (4 columnas) */
        @media (min-width: 1024px) {
            .tarjeta-perfume { flex: 1 1 calc(25% - 1.125rem); max-width: 100%; }
            .contenedor-flexible:not(.modo-clic):has(.tarjeta-perfume:hover) .tarjeta-perfume { flex-basis: calc(20% - 1.125rem); }
            .contenedor-flexible:not(.modo-clic) .tarjeta-perfume:hover { flex-basis: calc(40% - 1.125rem); flex-grow: 2; }
        }
        @media (min-width: 768px) and (max-width: 1023px) {
            .tarjeta-perfume { flex: 1 1 calc(33.333% - 1rem); max-width: 100%; }
            .contenedor-flexible:not(.modo-clic):has(.tarjeta-perfume:hover) .tarjeta-perfume { flex-basis: calc(25% - 1rem); }
            .contenedor-flexible:not(.modo-clic) .tarjeta-perfume:hover { flex-basis: calc(50% - 1rem); flex-grow: 2; }
        }
        @media (min-width: 640px) and (max-width: 767px) {
            .tarjeta-perfume { flex: 1 1 calc(50% - 0.75rem); max-width: 100%; }
            .contenedor-flexible:not(.modo-clic):has(.tarjeta-perfume:hover) .tarjeta-perfume { flex-basis: calc(40% - 0.75rem); }
            .contenedor-flexible:not(.modo-clic) .tarjeta-perfume:hover { flex-basis: calc(60% - 0.75rem); flex-grow: 2; }
        }
        @media (max-width: 639px) {
            .tarjeta-perfume { flex: 1 1 100%; }
        }

        /* 
         * ESTADO EXPANDIDO INTELIGENTE:
         * En lugar del 100%, ocupa un espacio de ~55% (equivalente a 2 columnas y media),
         * permitiendo que las demás tarjetas se acomoden limpiamente a su derecha en el espacio vacío.
         */
        .tarjeta-perfume.expandida {
            flex: 1 1 calc(55% - 0.75rem) !important;
            flex-grow: 2;
            height: 480px !important;
            border-color: #f59e0b;
            border-width: 2px;
            cursor: default;
        }
        @media (max-width: 1023px) {
            .tarjeta-perfume.expandida {
                flex: 1 1 100% !important; /* En pantallas chicas sí toma el 100% por espacio */
                height: 520px !important;
            }
        }

        /* Control de vistas sin parpadeos bruscos */
        .vista-detalle {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .tarjeta-perfume.expandida .vista-normal {
            opacity: 0;
            pointer-events: none;
            position: absolute;
        }
        .tarjeta-perfume.expandida .vista-detalle {
            opacity: 1;
            pointer-events: auto;
            transition: opacity 0.5s ease 0.3s;
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen selection:bg-amber-500 selection:text-zinc-950">

    <header class="border-b border-zinc-800/80 bg-zinc-900/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <span class="text-xs uppercase tracking-widest text-amber-500 font-semibold">Catálogo Personal</span>
                <h1 class="text-3xl font-bold tracking-tight text-white">ALQUIMISTA</h1>
            </div>
            <div class="bg-zinc-800/80 border border-zinc-700/50 px-5 py-2.5 rounded-full flex items-center gap-3 shadow-lg">
                <span class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse"></span>
                <span class="text-sm font-medium text-zinc-300">Total de Perfumes:</span>
                <span id="total-perfumes" class="text-lg font-bold text-amber-400">0</span>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <div class="mb-8 relative w-full md:w-96">
            <input type="text" id="buscador" placeholder="Buscar por marca o nombre..." 
                class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 text-sm text-zinc-200 focus:outline-none focus:border-amber-500 transition-colors">
        </div>

        <div id="grid-perfumes" class="contenedor-flexible w-full">
            <!-- Inyectado dinámicamente -->
        </div>
    </main>

    <script>
        const perfumesData = [
            { id: 1, marca: "TOM FORD", nombre: "Noir Extreme", temporada: "Invierno / Noche", notas: "Salida: Mandarina, Kulfi. Corazón: Rosa, Jazmín. Fondo: Ámbar, Vainilla.", imagen: "https://images.unsplash.com/photo-1523293182086-7651a899d37f?q=80&w=600&auto=format&fit=crop" },
            { id: 2, marca: "GIORGIO ARMANI", nombre: "Acqua Di Gio", temporada: "Todo el año / Versátil", notas: "Salida: Notas marinas. Corazón: Romero, Geranio. Fondo: Incienso, Pachuli.", imagen: "https://images.unsplash.com/photo-1594035910387-fea47794261f?q=80&w=600&auto=format&fit=crop" },
            { id: 3, marca: "CHANEL", nombre: "Allure Homme Sport", temporada: "Verano / Día", notas: "Salida: Mandarina. Corazón: Pimienta, Neroli. Fondo: Haba tonka, Almizcle.", imagen: "https://images.unsplash.com/photo-1547887537-6158d64c35b3?q=80&w=600&auto=format&fit=crop" },
            { id: 4, marca: "DIOR", nombre: "Sauvage Elixir", temporada: "Noche / Otoño", notas: "Salida: Canela, Nuez moscada. Corazón: Lavanda. Fondo: Regaliz, Ámbar.", imagen: "https://images.unsplash.com/photo-1523293182086-7651a899d37f?q=80&w=600&auto=format&fit=crop" },
            { id: 5, marca: "YSL", nombre: "Y Eau de Parfum", temporada: "Versátil / Primavera", notas: "Salida: Manzana, Jengibre. Corazón: Salvia. Fondo: Amberwood, Cedro.", imagen: "https://images.unsplash.com/photo-1594035910387-fea47794261f?q=80&w=600&auto=format&fit=crop" },
            { id: 6, marca: "CREED", nombre: "Aventus", temporada: "Primavera / Día", notas: "Salida: Piña, Bergamota. Corazón: Abedul, Pachulí. Fondo: Almizcle, Musgo.", imagen: "https://images.unsplash.com/photo-1547887537-6158d64c35b3?q=80&w=600&auto=format&fit=crop" },
            { id: 7, marca: "BLEU DE CHANEL", nombre: "Parfum", temporada: "Noche / Elegante", notas: "Salida: Limón, Bergamota. Corazón: Lavanda, Geranio. Fondo: Sándalo, Cedro.", imagen: "https://images.unsplash.com/photo-1523293182086-7651a899d37f?q=80&w=600&auto=format&fit=crop" },
            { id: 8, marca: "HERMÈS", nombre: "Terre d'Hermès", temporada: "Otoño / Diario", notas: "Salida: Naranja, Toronja. Corazón: Pimienta, Pelargonio. Fondo: Vetiver, Cedro.", imagen: "https://images.unsplash.com/photo-1594035910387-fea47794261f?q=80&w=600&auto=format&fit=crop" },
            { id: 9, marca: "JEAN PAUL GAULTIER", nombre: "Le Male Le Parfum", temporada: "Invierno / Nocturno", notas: "Salida: Cardamomo. Corazón: Lavanda, Iris. Fondo: Vainilla, Notas orientales.", imagen: "https://images.unsplash.com/photo-1547887537-6158d64c35b3?q=80&w=600&auto=format&fit=crop" }
        ];

        function inicializarCatalogo() {
            const grid = document.getElementById('grid-perfumes');
            grid.innerHTML = '';
            
            perfumesData.forEach((perfume) => {
                const card = document.createElement('div');
                card.id = `tarjeta-${perfume.id}`;
                card.className = "tarjeta-perfume bg-zinc-900 border border-zinc-800/80 rounded-2xl p-5 hover:border-amber-500/50 shadow-xl cursor-pointer group relative flex flex-col";
                
                card.innerHTML = `
                    <div class="vista-normal flex flex-col h-full w-full absolute inset-0 p-5">
                        <div class="h-40 rounded-xl bg-zinc-950 mb-4 overflow-hidden border border-zinc-800/50 flex items-center justify-center">
                            <img src="${perfume.imagen}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700 ease-out opacity-80 group-hover:opacity-100">
                        </div>
                        <span class="text-xs font-bold tracking-widest text-amber-500 uppercase block mb-1">${perfume.marca}</span>
                        <h3 class="text-base font-semibold text-zinc-100">${perfume.nombre}</h3>
                        <div class="mt-auto pt-3 border-t border-zinc-800/60 flex items-center justify-between text-xs text-zinc-500">
                            <span>Clic para expandir</span>
                            <span class="text-amber-500 font-bold">→</span>
                        </div>
                    </div>

                    <div class="vista-detalle absolute inset-0 p-5 md:p-6 flex flex-col lg:flex-row gap-5 items-center h-full">
                        <div class="w-full lg:w-1/3 h-36 lg:h-full rounded-xl overflow-hidden border border-zinc-800 flex-shrink-0">
                            <img src="${perfume.imagen}" class="w-full h-full object-cover">
                        </div>
                        <div class="flex-1 w-full flex flex-col h-full justify-between">
                            <div>
                                <div class="flex justify-between items-start">
                                    <span class="text-xs font-bold tracking-widest text-amber-500 uppercase">Detalle</span>
                                    <button onclick="event.stopPropagation(); cerrarTarjeta('${perfume.id}');" class="text-zinc-400 hover:text-white bg-zinc-800/80 px-3 py-1.5 rounded-full text-xs font-semibold transition-colors cursor-pointer z-10 relative">
                                        ✕ Cerrar
                                    </button>
                                </div>
                                <span class="text-xs font-bold tracking-widest text-amber-400 uppercase mt-1 block">${perfume.marca}</span>
                                <h2 class="text-xl lg:text-2xl font-bold text-white mb-2">${perfume.nombre}</h2>
                                <div class="space-y-2 text-xs lg:text-sm text-zinc-300">
                                    <div class="bg-zinc-950/60 p-3 rounded-xl border border-zinc-800/80">
                                        <strong class="text-amber-400 block mb-0.5">Temporada:</strong>${perfume.temporada}
                                    </div>
                                    <div class="bg-zinc-950/60 p-3 rounded-xl border border-zinc-800/80">
                                        <strong class="text-amber-400 block mb-0.5">Notas:</strong>${perfume.notas}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;

                card.onclick = () => abrirTarjeta(perfume.id);
                grid.appendChild(card);
            });

            document.getElementById('total-perfumes').innerText = perfumesData.length;
        }

        function abrirTarjeta(id) {
            const grid = document.getElementById('grid-perfumes');
            document.querySelectorAll('.tarjeta-perfume').forEach(card => card.classList.remove('expandida'));
            
            const tarjetaSeleccionada = document.getElementById(`tarjeta-${id}`);
            tarjetaSeleccionada.classList.add('expandida');
            grid.classList.add('modo-clic');

            setTimeout(() => {
                tarjetaSeleccionada.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
            }, 100);
        }

        function cerrarTarjeta(id) {
            document.getElementById(`tarjeta-${id}`).classList.remove('expandida');
            document.getElementById('grid-perfumes').classList.remove('modo-clic');
        }

        document.getElementById('buscador').addEventListener('input', (e) => {
            const filtro = e.target.value.toLowerCase();
            perfumesData.forEach(p => {
                const visible = p.marca.toLowerCase().includes(filtro) || p.nombre.toLowerCase().includes(filtro);
                document.getElementById(`tarjeta-${p.id}`).style.display = visible ? 'flex' : 'none';
            });
        });

        inicializarCatalogo();
    </script>
</body>
</html>
